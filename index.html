<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo-Draw: Common Sense Test!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for playful text -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
        }
        h1, h2, h3, .font-fun {
            font-family: 'Fredoka One', cursive;
        }
        .comic-border {
            border: 4px solid #000;
            box-shadow: 5px 5px 0px #000;
        }
        .comic-btn {
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }
        .comic-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }
        .comic-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #000;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 40px;
            border-width: 20px 15px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 38px;
            border-width: 23px 17px 0;
            border-style: solid;
            border-color: #000000 transparent;
            display: block;
            width: 0;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }
        .animate-wiggle {
            animation: wiggle 0.25s infinite;
        }
        .canvas-bg {
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 flex flex-col justify-between max-w-7xl mx-auto">

    <header class="comic-border bg-amber-300 p-4 rounded-2xl mb-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
        <div class="flex items-center gap-3">
            <div class="text-4xl">🤖</div>
            <div>
                <h1 class="text-2xl md:text-3xl text-black">Robo-Draw: Common Sense Test!</h1>
                <p class="text-xs md:text-sm font-bold text-gray-800">Type instructions to draw a house and see if Robo-Draw can understand you!</p>
            </div>
        </div>
        <button onclick="resetAll()" class="comic-btn bg-white hover:bg-gray-100 text-black font-fun px-4 py-2 rounded-xl text-sm">
            🔄 Try Again
        </button>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">

        <!-- Left Column: Step-by-Step Text Inputs -->
        <section class="lg:col-span-5 flex flex-col gap-3">
            <div class="comic-border bg-white p-4 rounded-2xl">
                <h2 class="font-fun text-lg text-gray-900 mb-3 flex items-center justify-between">
                    <span>📝 Type Drawing Steps:</span>
                    <span class="text-xs text-purple-600 font-bold">Steps 1 to 5</span>
                </h2>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-fun text-gray-700 mb-1">Step 1: House Base / Walls</label>
                        <input type="text" id="step1-input" class="w-full border-3 border-black rounded-xl p-2.5 text-sm font-bold bg-slate-50 focus:bg-white focus:outline-none" placeholder="Type step 1 instruction...">
                    </div>
                    <div>
                        <label class="block text-xs font-fun text-gray-700 mb-1">Step 2: Roof</label>
                        <input type="text" id="step2-input" class="w-full border-3 border-black rounded-xl p-2.5 text-sm font-bold bg-slate-50 focus:bg-white focus:outline-none" placeholder="Type step 2 instruction...">
                    </div>
                    <div>
                        <label class="block text-xs font-fun text-gray-700 mb-1">Step 3: Door</label>
                        <input type="text" id="step3-input" class="w-full border-3 border-black rounded-xl p-2.5 text-sm font-bold bg-slate-50 focus:bg-white focus:outline-none" placeholder="Type step 3 instruction...">
                    </div>
                    <div>
                        <label class="block text-xs font-fun text-gray-700 mb-1">Step 4: Window</label>
                        <input type="text" id="step4-input" class="w-full border-3 border-black rounded-xl p-2.5 text-sm font-bold bg-slate-50 focus:bg-white focus:outline-none" placeholder="Type step 4 instruction...">
                    </div>
                    <div>
                        <label class="block text-xs font-fun text-gray-700 mb-1">Step 5: Sun</label>
                        <input type="text" id="step5-input" class="w-full border-3 border-black rounded-xl p-2.5 text-sm font-bold bg-slate-50 focus:bg-white focus:outline-none" placeholder="Type step 5 instruction...">
                    </div>
                </div>

                <button onclick="runRobot()" class="comic-btn w-full mt-4 bg-yellow-400 hover:bg-yellow-300 text-black font-fun text-base py-3 rounded-xl flex items-center justify-center gap-2">
                    🚀 Run Robot!
                </button>
            </div>
        </section>

        <!-- Right Column: Canvas Display & Animated Robot -->
        <section class="lg:col-span-7 flex flex-col gap-3">
            
            <!-- Speech Bubble -->
            <div class="speech-bubble p-4 mx-2">
                <p id="robot-speech" class="text-sm font-extrabold text-gray-900 leading-snug">
                    "Beep Boop! 👋 I am Robo-Draw! Type your instructions on the left and click 'Run Robot!'."
                </p>
            </div>

            <!-- Drawing Stage Canvas Container -->
            <div class="comic-border bg-sky-100 rounded-2xl h-[400px] relative overflow-hidden canvas-bg flex flex-col justify-between">
                
                <!-- Sky Background Elements -->
                <div class="absolute top-4 left-4 text-2xl select-none">☁️</div>
                <div class="absolute top-6 left-28 text-xl opacity-70 select-none">☁️</div>
                <div class="absolute top-3 right-6 text-2xl select-none">☀️</div>
                <!-- Grass Ground Floor -->
                <div class="absolute bottom-0 w-full h-14 bg-emerald-400 border-t-4 border-black"></div>

                <!-- SVG Canvas Engine -->
                <svg id="drawing-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 500 400">
                    <!-- Dynamic rendering -->
                </svg>

                <!-- SVG Animated Robo-Draw Avatar -->
                <div id="robot-avatar" class="absolute bottom-2 right-4 z-20 transition-transform duration-300">
                    <svg width="110" height="130" viewBox="0 0 140 160">
                        <!-- Antenna -->
                        <line x1="70" y1="30" x2="70" y2="10" stroke="black" stroke-width="4"/>
                        <circle id="robot-antenna" cx="70" cy="10" r="8" fill="#f43f5e" stroke="black" stroke-width="3"/>
                        
                        <!-- Head -->
                        <rect x="35" y="30" width="70" height="50" rx="10" fill="#e2e8f0" stroke="black" stroke-width="4"/>
                        <!-- Screen -->
                        <rect x="43" y="38" width="54" height="34" rx="6" fill="#0f172a" stroke="black" stroke-width="2"/>
                        <!-- Eyes -->
                        <circle id="eye-l" cx="56" cy="52" r="6" fill="#38bdf8"/>
                        <circle id="eye-r" cx="84" cy="52" r="6" fill="#38bdf8"/>
                        <!-- Mouth -->
                        <path id="robot-mouth" d="M 56 64 Q 70 68 84 64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

                        <!-- Body -->
                        <rect x="30" y="85" width="80" height="55" rx="8" fill="#94a3b8" stroke="black" stroke-width="4"/>
                        <circle cx="50" cy="100" r="4" fill="#f43f5e"/>
                        <circle cx="70" cy="100" r="4" fill="#eab308"/>
                        <circle cx="90" cy="100" r="4" fill="#22c55e"/>

                        <!-- Paintbrush Arm -->
                        <path d="M 110 95 L 125 110" stroke="black" stroke-width="8" stroke-linecap="round"/>
                        <circle cx="127" cy="112" r="5" fill="#334155"/>
                        <line x1="127" y1="112" x2="134" y2="98" stroke="brown" stroke-width="4"/>
                        <circle cx="135" cy="95" r="4" fill="#38bdf8"/>

                        <!-- Feet -->
                        <rect x="42" y="140" width="20" height="15" rx="3" fill="#0f172a" stroke="black" stroke-width="2"/>
                        <rect x="78" y="140" width="20" height="15" rx="3" fill="#0f172a" stroke="black" stroke-width="2"/>
                    </svg>
                </div>

            </div>
        </section>

    </main>

    <script>
        // Web Audio Synthesizer for Kids Sound Effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(isSilly) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (isSilly) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        // Animated Robot Facial Expression Handler
        function setRobotMood(mood, message) {
            const eyeL = document.getElementById('eye-l');
            const eyeR = document.getElementById('eye-r');
            const mouth = document.getElementById('robot-mouth');
            const antenna = document.getElementById('robot-antenna');
            const avatar = document.getElementById('robot-avatar');
            const speech = document.getElementById('robot-speech');

            speech.innerText = message;

            avatar.classList.add('animate-wiggle');
            setTimeout(() => avatar.classList.remove('animate-wiggle'), 350);

            if (mood === 'silly') {
                eyeL.setAttribute('fill', '#f43f5e');
                eyeR.setAttribute('fill', '#f43f5e');
                antenna.setAttribute('fill', '#f43f5e');
                mouth.setAttribute('d', 'M 56 68 Q 70 56 84 68');
            } else if (mood === 'happy') {
                eyeL.setAttribute('fill', '#22c55e');
                eyeR.setAttribute('fill', '#22c55e');
                antenna.setAttribute('fill', '#22c55e');
                mouth.setAttribute('d', 'M 56 60 Q 70 74 84 60');
            } else {
                eyeL.setAttribute('fill', '#38bdf8');
                eyeR.setAttribute('fill', '#38bdf8');
                antenna.setAttribute('fill', '#f43f5e');
                mouth.setAttribute('d', 'M 56 64 Q 70 68 84 64');
            }
        }

        // Color Dictionaries for Specificity Checking
        const colorKeywords = [
            'red', 'blue', 'green', 'yellow', 'brown', 'orange', 'purple', 'pink',
            'black', 'white', 'gray', 'grey', 'cyan', 'gold'
        ];

        // Helper function to extract color or return default
        function extractColor(text, defaultColor) {
            const found = colorKeywords.find(c => text.includes(c));
            return found ? found : defaultColor;
        }

        // Strict Specificity Analyzer Engine
        function isPromptSpecific(text, shapeWords, locationWords) {
            const lower = text.toLowerCase().trim();
            if (!lower) return false;

            // Must contain at least one shape/object keyword
            const hasShape = shapeWords.some(w => lower.includes(w));
            
            // Must contain at least one color keyword
            const hasColor = colorKeywords.some(c => lower.includes(c));

            // Must contain at least one location/position or size keyword
            const hasLocationOrSize = locationWords.some(l => lower.includes(l));

            return hasShape && hasColor && hasLocationOrSize;
        }

        // Main Drawing Processor executed on "Run Robot!"
        function runRobot() {
            const canvas = document.getElementById('drawing-canvas');
            canvas.innerHTML = '';

            const p1 = document.getElementById('step1-input').value.trim().toLowerCase();
            const p2 = document.getElementById('step2-input').value.trim().toLowerCase();
            const p3 = document.getElementById('step3-input').value.trim().toLowerCase();
            const p4 = document.getElementById('step4-input').value.trim().toLowerCase();
            const p5 = document.getElementById('step5-input').value.trim().toLowerCase();

            if (!p1 && !p2 && !p3 && !p4 && !p5) {
                setRobotMood('normal', "Beep boop! Type at least step 1 before running!");
                return;
            }

            let vagueCount = 0;

            // STEP 1: House Base / Walls
            if (p1) {
                const specific = isPromptSpecific(p1, 
                    ['square', 'box', 'house', 'base', 'wall', 'rectangle'], 
                    ['middle', 'center', 'bottom', 'big', 'large', 'ground', '100px', 'center bottom']
                );

                if (specific) {
                    const c = extractColor(p1, '#38bdf8');
                    canvas.innerHTML += `<rect x="175" y="180" width="150" height="130" fill="${c}" stroke="black" stroke-width="4"/>`;
                } else {
                    vagueCount++;
                    // Silly tiny square in random upper corner
                    canvas.innerHTML += `<rect x="15" y="15" width="25" height="25" fill="#f43f5e" stroke="black" stroke-width="3"/>`;
                }
            }

            // STEP 2: Roof
            if (p2) {
                const specific = isPromptSpecific(p2, 
                    ['triangle', 'roof', 'top'], 
                    ['top of', 'above', 'on top', 'square', 'house', 'middle', 'center']
                );

                if (specific) {
                    const c = extractColor(p2, '#ef4444');
                    canvas.innerHTML += `<polygon points="160,180 250,100 340,180" fill="${c}" stroke="black" stroke-width="4"/>`;
                } else {
                    vagueCount++;
                    // Silly floating upside-down triangle in sky
                    canvas.innerHTML += `<polygon points="380,20 450,20 415,80" fill="#a855f7" stroke="black" stroke-width="3"/>`;
                }
            }

            // STEP 3: Door
            if (p3) {
                const specific = isPromptSpecific(p3, 
                    ['door', 'entrance', 'rectangle'], 
                    ['bottom', 'middle', 'center', 'inside', 'front', 'square', 'house', 'ground']
                );

                if (specific) {
                    const c = extractColor(p3, '#78350f');
                    canvas.innerHTML += `
                        <rect x="225" y="240" width="50" height="70" fill="${c}" stroke="black" stroke-width="3"/>
                        <circle cx="265" cy="275" r="4" fill="gold" stroke="black" stroke-width="1"/>
                    `;
                } else {
                    vagueCount++;
                    // Silly door floating sideways off on the side
                    canvas.innerHTML += `
                        <g transform="rotate(50, 80, 150)">
                            <rect x="80" y="150" width="35" height="65" fill="#14b8a6" stroke="black" stroke-width="3"/>
                        </g>
                    `;
                }
            }

            // STEP 4: Window
            if (p4) {
                const specific = isPromptSpecific(p4, 
                    ['window', 'glass', 'square', 'circle'], 
                    ['inside', 'middle', 'house', 'square', 'top', 'left', 'right', 'two', '2']
                );

                if (specific) {
                    const c = extractColor(p4, '#facc15');
                    canvas.innerHTML += `
                        <rect x="195" y="200" width="30" height="30" fill="${c}" stroke="black" stroke-width="3"/>
                        <line x1="210" y1="200" x2="210" y2="230" stroke="black" stroke-width="2"/>
                        <line x1="195" y1="215" x2="225" y2="215" stroke="black" stroke-width="2"/>
                        <rect x="275" y="200" width="30" height="30" fill="${c}" stroke="black" stroke-width="3"/>
                        <line x1="290" y1="200" x2="290" y2="230" stroke="black" stroke-width="2"/>
                        <line x1="275" y1="215" x2="305" y2="215" stroke="black" stroke-width="2"/>
                    `;
                } else {
                    vagueCount++;
                    // Silly windows scattered everywhere in sky and ground
                    canvas.innerHTML += `
                        <circle cx="70" cy="220" r="12" fill="#ec4899" stroke="black" stroke-width="2"/>
                        <circle cx="410" cy="260" r="14" fill="#ec4899" stroke="black" stroke-width="2"/>
                        <circle cx="250" cy="40" r="10" fill="#ec4899" stroke="black" stroke-width="2"/>
                    `;
                }
            }

            // STEP 5: Sun
            if (p5) {
                const specific = isPromptSpecific(p5, 
                    ['sun', 'sol', 'circle', 'sky'], 
                    ['top', 'right', 'left', 'corner', 'small', 'upper', 'sky']
                );

                if (specific) {
                    const c = extractColor(p5, '#facc15');
                    canvas.innerHTML += `
                        <circle cx="430" cy="60" r="30" fill="${c}" stroke="black" stroke-width="4"/>
                        <line x1="430" y1="15" x2="430" y2="5" stroke="black" stroke-width="3"/>
                        <line x1="430" y1="105" x2="430" y2="115" stroke="black" stroke-width="3"/>
                        <line x1="385" y1="60" x2="375" y2="60" stroke="black" stroke-width="3"/>
                        <line x1="475" y1="60" x2="485" y2="60" stroke="black" stroke-width="3"/>
                    `;
                } else {
                    vagueCount++;
                    // Giant sun covering half the screen
                    canvas.innerHTML += `
                        <circle cx="250" cy="200" r="170" fill="#facc15" opacity="0.8" stroke="black" stroke-width="6"/>
                        <text x="150" y="210" font-family="Fredoka One" font-size="20" fill="black">GIANT SUN BLOB!</text>
                    `;
                }
            }

            // Provide Robot Feedback Speech
            if (vagueCount > 0) {
                playSound(true);
                setRobotMood('silly', `Be more specific! I don't have common sense so I guessed where, how big, or what color!`);
            } else {
                playSound(false);
                setRobotMood('happy', `Bleep Boop! Your instructions were super specific with shape, color, and location! Look at your house!`);
            }
        }

        // Reset All Input Fields and Canvas
        function resetAll() {
            document.getElementById('step1-input').value = '';
            document.getElementById('step2-input').value = '';
            document.getElementById('step3-input').value = '';
            document.getElementById('step4-input').value = '';
            document.getElementById('step5-input').value = '';
            document.getElementById('drawing-canvas').innerHTML = '';
            
            setRobotMood('normal', "Beep Boop! 👋 Inputs cleared! Type your step-by-step instructions and click 'Run Robot!'");
            playSound(false);
        }
    </script>
</body>
</html>
